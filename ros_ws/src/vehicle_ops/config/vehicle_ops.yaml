vehicle_ops_api:
  ros__parameters:
    bind_address: 0.0.0.0
    port: 8088
    request_limit_bytes: 1048576
    http_worker_count: 8
    http_queue_limit: 32
    http_socket_timeout_seconds: 3.0
    service_timeout_seconds: 2.0
    stale_after_seconds: 3.0
    debug_timeout_seconds: 45.0
    camera_dark_mean_threshold: 2.0
    runtime_switch_command_timeout_seconds: 0.5
    runtime_switch_stationary_linear_threshold: 0.02
    runtime_switch_stationary_angular_threshold: 0.05
    operator_token: ""
    project_root: ""
    jobs_root: ""
    camera_calibration_path: ""
    camera_calibration_metadata_path: ""
    camera_component_id: "front_camera"
    camera_calibration_verify_timeout_seconds: 8.0
