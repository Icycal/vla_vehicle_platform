observation_monitor:
  ros__parameters:
    camera_timeout: 0.5
    odometry_timeout: 0.5
    imu_timeout: 0.5
    require_camera: true
    require_calibration: false
    require_odometry: false
    require_imu: false
    publish_frequency: 2.0
    output_topic: /vehicle/observation_status
    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info
    odometry_topic: /odom
    imu_topic: /imu/data_raw

observation_adapter:
  ros__parameters:
    publish_frequency: 5.0
    image_timeout: 0.5
    observation_validity: 0.5
    require_status_ready: true
    base_frame: base_link
    output_topic: /vla/observation
    image_topic: /camera/image_compressed
    status_topic: /vehicle/observation_status
    odometry_topic: /odom
    imu_topic: /imu/data_raw
    command_topic: /cmd_vel
    battery_topic: /PowerVoltage
    task_topic: /vla/task

shadow_evaluator:
  ros__parameters:
    prediction_timeout: 0.75
    linear_error_threshold: 0.10
    angular_error_threshold: 0.20

episode_recorder:
  ros__parameters:
    storage_root: ""
    minimum_free_space_gb: 10.0
    max_episode_duration: 900.0
    image_record_frequency: 5.0
    require_observation_ready: true
pipeline_trace_aggregator:
  ros__parameters:
    publish_frequency: 2.0
    stale_seconds: 3.0
    camera_stale_seconds: 1.0
    command_stale_seconds: 0.75
    policy_action_stale_seconds: 5.0
    shadow_stale_seconds: 5.0
vla_debug_orchestrator:
  ros__parameters:
    artifact_root: ""
    observation_timeout: 1.0
    command_timeout: 0.5
    stationary_linear_threshold: 0.02
    stationary_angular_threshold: 0.05
    require_shadow_mode: true
    provider_busy_retry_count: 5
    provider_busy_retry_delay_ms: 350
    max_snapshots: 20
