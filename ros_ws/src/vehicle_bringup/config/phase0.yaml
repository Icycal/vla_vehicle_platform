vehicle_supervisor:
  ros__parameters: {}

vla_policy_gateway:
  ros__parameters:
    transport: mock
    socket_path: "/run/vla-policy/policy.sock"
    transport_timeout: 1.0
    action_horizon: 8
    control_period_ms: 50
    prediction_frequency: 5.0
    observation_timeout: 0.75
    mock_linear_velocity: 0.0
    mock_angular_velocity: 0.0

vla_action_runtime:
  ros__parameters:
    execution_frequency: 20.0

vla_control_mux:
  ros__parameters:
    source_timeout: 0.3
    publish_frequency: 20.0
    output_frame: base_link
    output_topic: /control/cmd_vel_selected
    state_topic: /vehicle/system_state
    nav_topic: /nav2/cmd_vel
    vla_topic: /vla/cmd_vel_raw
    mobile_topic: /mobile_teleop/cmd_vel

vla_safety_guard:
  ros__parameters:
    max_linear_velocity: 0.4
    max_reverse_velocity: 0.2
    max_angular_velocity: 0.8
    command_timeout: 0.3
    scan_timeout: 0.5
    stop_distance: 0.45
    obstacle_half_angle: 0.52
    require_scan: false
    publish_frequency: 20.0
    output_topic: /cmd_vel
    event_topic: /vla/safety_event
    selected_command_topic: /control/cmd_vel_selected
    scan_topic: /scan
vla_debug_orchestrator:
  ros__parameters:
    transport: mock
    socket_path: "/run/vla-policy/policy.sock"
    transport_timeout: 1.0
