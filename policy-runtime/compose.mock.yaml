services:
  policy-runtime:
    build:
      context: ..
      dockerfile: policy-runtime/Dockerfile.mock
      network: host
    environment:
      POLICY_PROVIDER: mock
      POLICY_SOCKET_PATH: /run/vla-policy/policy.sock
      POLICY_HEALTH_TIMEOUT: "1.0"
    healthcheck:
      test: ["CMD", "python3", "-m", "runtime.healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    user: "${POLICY_RUNTIME_UID:-1000}:${POLICY_RUNTIME_GID:-1000}"
    volumes:
      - ../run/policy:/run/vla-policy
    network_mode: none
    restart: unless-stopped
