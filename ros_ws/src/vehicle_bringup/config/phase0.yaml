vehicle_supervisor:
  ros__parameters: {}

vla_policy_gateway:
  ros__parameters:
    action_horizon: 8
    control_period_ms: 50
    prediction_frequency: 5.0
    observation_timeout: 0.75
    mock_linear_velocity: 0.0
    mock_angular_velocity: 0.0

vla_action_runtime:
  ros__parameters:
    execution_frequency: 20.0

vla_control_mux:
  ros__parameters:
    source_timeout: 0.3
    publish_frequency: 20.0

vla_safety_guard:
  ros__parameters:
    max_linear_velocity: 0.4
    max_reverse_velocity: 0.2
    max_angular_velocity: 0.8
    command_timeout: 0.3
    scan_timeout: 0.5
    stop_distance: 0.45
    obstacle_half_angle: 0.52
    require_scan: false
    publish_frequency: 20.0
